services:
  backend:
    build:
      context: ./backend
    container_name: campusbite-backend
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: sqlite:////app/data/campusbite.db
      SECRET_KEY: ${SECRET_KEY:-campusbite-development-secret-key}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - campusbite_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: campusbite-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  campusbite_data:
